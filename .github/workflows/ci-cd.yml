name: CI/CD - Azure Voting App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: azure-vote-front
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================
  # JOB 1: Lint & Code Quality
  # ============================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Analise com flake8
        run: |
          flake8 azure-vote/azure-vote/main.py --max-line-length=120 --ignore=E501,W391 || true

  # ============================
  # JOB 2: Build Docker
  # ============================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -t ${{ env.IMAGE_NAME }}:latest ./azure-vote

      - name: Listar imagem construida
        run: docker images | grep ${{ env.IMAGE_NAME }}

      - name: Salvar imagem como artefato
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o azure-vote-image.tar
          ls -lh azure-vote-image.tar

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: azure-vote-image.tar
          retention-days: 7

  # ============================
  # JOB 3: Testes com Docker Compose
  # ============================
  test:
    name: Testes Integrados (Docker Compose)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Baixar artefato da imagem
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: |
          docker load -i azure-vote-image.tar
          docker images | grep ${{ env.IMAGE_NAME }}

      - name: Tag imagem para docker-compose
        run: docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} mcr.microsoft.com/azuredocs/azure-vote-front:v1

      - name: Subir aplicacao com Docker Compose
        run: |
          docker-compose up -d
          sleep 15
          docker ps

      - name: Testar conexao HTTP
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" http://localhost:8080
          curl -s http://localhost:8080 | grep -i "vote" || exit 1

      - name: Testar Redis
        run: |
          docker exec azure-vote-back redis-cli ping
          docker exec azure-vote-back redis-cli get "Cats" || true

      - name: Logs da aplicacao
        if: always()
        run: |
          docker logs azure-vote-front || true
          docker logs azure-vote-back || true

      - name: Derrubar aplicacao
        if: always()
        run: docker-compose down

  # ============================
  # JOB 4: Security Scan
  # ============================
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Baixar artefato da imagem
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: |
          docker load -i azure-vote-image.tar

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

  # ============================
  # JOB 5: Deploy (apenas main)
  # ============================
  deploy:
    name: Deploy (Producao)
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Baixar artefato da imagem
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Carregar imagem Docker
        run: docker load -i azure-vote-image.tar

      - name: Login no Docker Hub (opcional)
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push imagem para Docker Hub (opcional)
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Resumo do deploy
        run: |
          echo "========================================"
          echo "  DEPLOY CONCLUIDO - Azure Voting App"
          echo "========================================"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Imagem: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Autor: ${{ github.actor }}"
          echo "Status: Sucesso"
          echo "========================================"