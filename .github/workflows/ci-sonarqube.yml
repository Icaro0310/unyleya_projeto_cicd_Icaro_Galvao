name: CI - SonarQube Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Shallow clones should be disabled for SonarQube

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install sonar-scanner

    - name: Lint with flake8
      run: |
        flake8 azure-vote/azure-vote/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 azure-vote/azure-vote/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: SonarQube Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        sonar-scanner \
          -Dsonar.projectKey=unyleya-projeto-cicd \
          -Dsonar.organization=icaro-galvao \
          -Dsonar.sources=azure-vote/azure-vote \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.login=$SONAR_TOKEN