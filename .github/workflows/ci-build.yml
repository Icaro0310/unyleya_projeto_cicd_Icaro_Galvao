name: CI - Build e Push Imagem

on:
  push:
    branches: [ main, master ]
    paths:
      - 'azure-vote/**'
      - '.github/workflows/ci-build.yml'
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: azure-vote-front
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================
  # JOB 1: Lint & Code Quality
  # ============================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Instalar flake8
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Analise com flake8
        run: |
          flake8 azure-vote/azure-vote/main.py --max-line-length=120 --ignore=E501,W391 || true

  # ============================
  # JOB 2: Build Docker Image
  # ============================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Build da imagem Docker
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
                       -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest \
                       ./azure-vote

      - name: Login no GitHub Container Registry (substituto do ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push imagem para o registry (substituto do ACR)
        run: |
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest

      - name: Salvar tag da imagem como artefato
        run: |
          echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" > image-tag.txt
          cat image-tag.txt

      - name: Upload artefato com a tag da imagem
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image-tag.txt
          retention-days: 30

  # ============================
  # JOB 3: Security Scan (Trivy)
  # ============================
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

  # ============================
  # JOB 4: Validar Helm Chart
  # ============================
  helm-validate:
    name: Validar Helm Chart
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Helm
        uses: azure/setup-helm@v4

      - name: Lint do Helm Chart
        run: helm lint iac/helm/azure-vote

      - name: Template do Helm Chart
        run: helm template azure-vote iac/helm/azure-vote --set frontend.image.repository=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }} --set frontend.image.tag=${{ env.IMAGE_TAG }}

  # ============================
  # JOB 5: Validar Terraform
  # ============================
  terraform-validate:
    name: Validar Terraform
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          cd iac/terraform-k8s
          terraform init -backend=false

      - name: Terraform Validate
        run: |
          cd iac/terraform-k8s
          terraform validate

      - name: Terraform Format Check
        run: |
          cd iac/terraform-k8s
          terraform fmt -check -recursive